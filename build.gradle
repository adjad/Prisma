plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.fabricmc.net/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
	implementation "net.fabricmc.fabric-api:fabric-command-api-v2:3.1.0+00cb03469e"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// The experimental native core is built from the reviewable source in this repository.
def rtCore = layout.projectDirectory.dir('rt-core')
tasks.register('buildNativeRt', Exec) {
	workingDir rtCore
	commandLine 'sh', 'build.sh'
	inputs.files(fileTree(rtCore) { include '*.h', '*.mm', '*.metal', 'build.sh' })
	outputs.file(rtCore.file('build/librtcore.dylib'))
}
tasks.named('processResources') {
	dependsOn 'buildNativeRt'
	from(rtCore.file('build/librtcore.dylib')) { into 'native/macos-aarch64' }
	from(rtCore.file('trace.metal')) { into 'assets/metallum/rt' }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Small executable proofs use the actual command tree and production settings store.
// They do not launch Minecraft, change an installed instance, or require a GPU.
sourceSets {
	rtProof {
	java.srcDir 'diagnostics'
		java.include 'RtSettingsProof.java', 'RtClientControlsProof.java'
		compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}
tasks.register('verifyRtSettings', JavaExec) {
	dependsOn 'rtProofClasses'
	classpath = sourceSets.rtProof.runtimeClasspath
	mainClass = 'RtSettingsProof'
	maxHeapSize = '128m'
}
tasks.register('verifyRtClientControls', JavaExec) {
	dependsOn 'rtProofClasses'
	classpath = sourceSets.rtProof.runtimeClasspath
	mainClass = 'RtClientControlsProof'
	maxHeapSize = '128m'
}
tasks.named('check') { dependsOn 'verifyRtSettings', 'verifyRtClientControls' }

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
